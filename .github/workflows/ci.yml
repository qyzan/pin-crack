name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        exclude:
          # Keep the matrix small: other OSes are covered on the newest PHP.
          - { os: windows-latest, php: '8.1' }
          - { os: windows-latest, php: '8.2' }
          - { os: windows-latest, php: '8.3' }
          - { os: macos-latest, php: '8.1' }
          - { os: macos-latest, php: '8.2' }
          - { os: macos-latest, php: '8.3' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the tool without Composer's autoloader
        shell: bash
        run: |
          mv vendor vendor-dev
          php bin/pin-crack --version
          php bin/pin-crack --save-wordlist ci-wordlist.txt --digits 4
          php bin/pin-crack --hash "$(php -r 'echo password_hash("1234", PASSWORD_BCRYPT, ["cost" => 4]);')" \
            --digits 4 --workers 2 --quiet
          rm -f ci-wordlist.txt
          mv vendor-dev vendor

      - name: Tests
        run: php vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: php vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: php -l on every source file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || status=1
          done < <(find src tests bin -type f \( -name '*.php' -o -name 'pin-crack' \))
          exit $status
